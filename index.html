<!doctype html>
<html lang="hu">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elite Swans — Naptár</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#d6689d;--dark:#38294f;--bg:#F5B8EB;--line:#f5d0e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--dark)}

/* Teljes kép alapú fejléc */
header{padding:0;text-align:center;background:transparent;position:relative;}
.header-bg-img{width:100%;max-height:280px;object-fit:cover;display:block;}
.header-content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;text-shadow:0 2px 4px rgba(0,0,0,0.7);width:100%;padding:0 15px;}

main{max-width:800px;margin:22px auto;padding:0 14px 40px}
.panel{background:white;padding:20px;border-radius:16px;margin-bottom:18px;box-shadow:0 5px 18px #d6689d22}
input,select,textarea,button{font:inherit;padding:11px;border-radius:9px}
input,select{width:100%;border:1px solid #f2b6dc;margin:5px 0 12px}
button{border:0;background:var(--p);color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small{font-size:14px;color:#766887;line-height:1.5}
.item{border-bottom:1px solid var(--line);padding:14px 0;line-height:1.6}.item:last-child{border:0}
.tabs{display:flex;gap:8px;margin-bottom:15px}

/* Program info elemek egymás alatt */
.program-detail { display: block; font-size: 14px; color: #66526f; margin-top: 4px; }

@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body>

<header>
    <!-- Itt a fejléc maga a feltöltött képed lesz háttérként vagy fő képként. Írd be a képfájlod nevét a src-be! -->
    <img src="banner.jpg" alt="Elite Swans Háttér" class="header-bg-img">
    <div class="header-content">
        <h1>🦢 Elite Swans naptár</h1>
        <p>Programok és elérhetőségek</p>
    </div>
</header>

<main>

<section class="panel">
<h2>💖 Elérhetőség jelzése</h2>
<p class="small">Írd be a neved, válaszd ki a hetet, majd jelöld be azokat a napokat, amikor ráérsz.</p>
<label>Neved</label><input id="name" maxlength="100" placeholder="Pl. Anna">
<div class="tabs">
  <button id="btnA" type="button">A hét</button>
  <button id="btnB" type="button" style="background:#f0a8d4">B hét</button>
</div>
<p id="weekTitle" class="small"><b>Kijelölt hét: A hét</b></p>
<div class="row" id="daysContainer"></div>
<button id="submitBtn">Elérhetőség elküldése</button><p id="status" class="small"></p>
</section>

<section class="panel">
<h2>💖 Programok</h2>
<p class="small">Itt láthatod a vezetők által hozzáadott programokat.</p>
<div class="tabs">
  <button id="pBtnA" type="button">A hét</button>
  <button id="pBtnB" type="button" style="background:#f0a8d4">B hét</button>
</div>
<div id="programList"></div>
</section>

</main>

<script>
const SUPABASE_URL="https://cxcexrtuecceeqgigoaf.supabase.co";
const SUPABASE_KEY="sb_publishable_Dh4JNnbdvIn_g4P04oEJA_Hnslu9t1";
const DAYS=["Hétfő","Kedd","Szerda","Csütörtök","Péntek","Szombat","Vasárnap"];
const ready=SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("IDE_MASOLD")&&!SUPABASE_KEY.includes("IDE_MASOLD");
const db=ready?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=id=>document.getElementById(id);

let currentWeek="A";
let pWeek="A";
let selectedDays={};

$("btnA").onclick=()=>{currentWeek="A";$("btnA").style.background="#d6689d";$("btnB").style.background="#f0a8d4";renderDays();};
$("btnB").onclick=()=>{currentWeek="B";$("btnB").style.background="#d6689d";$("btnA").style.background="#f0a8d4";renderDays();};

$("pBtnA").onclick=()=>{pWeek="A";$("pBtnA").style.background="#d6689d";$("pBtnB").style.background="#f0a8d4";loadPrograms();};
$("pBtnB").onclick=()=>{pWeek="B";$("pBtnB").style.background="#d6689d";$("pBtnA").style.background="#f0a8d4";loadPrograms();};

function renderDays(){
  const c=$("daysContainer");c.replaceChildren();
  DAYS.forEach(d=>{
    const l=document.createElement("label");l.style.cssText="display:flex;align-items:center;gap:8px;padding:10px;background:#fff5fc;border:1px solid #f2b6dc;border-radius:8px;cursor:pointer;";
    const cb=document.createElement("input");cb.type="checkbox";cb.style.width="auto";cb.style.margin="0";cb.checked=!!selectedDays[currentWeek]?.[d];
    cb.onchange=()=>{if(!selectedDays[currentWeek])selectedDays[currentWeek]={};selectedDays[currentWeek][d]=cb.checked;};
    l.append(cb,document.createTextNode(d));c.append(l);
  });
}
renderDays();

$("submitBtn").onclick=async()=>{
  if(!db){$("status").textContent="Állítsd be a Supabase adatokat.";return;}
  const name=$("name").value.trim();if(!name){$("status").textContent="Add meg a neved.";return;}
  const daysArr=Object.keys(selectedDays[currentWeek]||{}).filter(k=>selectedDays[currentWeek][k]);
  if(!daysArr.length){$("status").textContent="Jelölj be legalább egy napot.";return;}
  $("status").textContent="Mentés…";
  for(const day of daysArr){
    await db.from("availability").insert({week:currentWeek,day:day,name:name});
  }
  $("status").textContent="Sikeres elküldés!";
};

async function loadPrograms(){
  if(!db)return;const out=$("programList");out.textContent="Betöltés…";
  
  const {data,error}=await db.from("programs").select("*").eq("week",pWeek).order("day").order("time_text", {ascending: true});
  
  if(error){out.textContent="Nem sikerült betölteni a programokat.";return;}
  out.replaceChildren();if(!data.length){out.textContent="Még nincs program erre a hétre.";return;}
  
  data.forEach(p=>{
    const div=document.createElement("div");div.className="item";
    
    const strong=document.createElement("strong");
    strong.textContent=p.day+" — "+p.title;
    div.append(strong);
    
    // Program adatok egymás alatt külön sorokban
    if(p.time_text){
      const timeDiv=document.createElement("div");
      timeDiv.className="program-detail";
      timeDiv.textContent="⏰ Időpont: " + p.time_text;
      div.append(timeDiv);
    }
    
    if(p.description){
      const descDiv=document.createElement("div");
      descDiv.className="program-detail";
      descDiv.textContent="📍 " + p.description;
      div.append(descDiv);
    }
    
    out.append(div);
  });
}
loadPrograms();
</script></body></html>
